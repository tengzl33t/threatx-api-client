name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - name: Repo checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Prepare environment
        uses: "./.github/actions/environment"

      - name: Ruff check
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest --testmon
        env:
          TX_API_KEY: ${{ secrets.TX_API_KEY }}
          TX_API_TEST_TENANT: ${{ secrets.TX_API_TEST_TENANT }}

      - name: Save test cache
        uses: actions/cache/save@v5
        if: success()
        with:
          path: .testmondata
          key: testmon-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build Python WHL package
        run: uv build --wheel

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: ./dist/*.whl
          file_glob: true
          tag: ${{ github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
